<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Запушиха те?</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 font-sans">


<header class="w-full bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto flex items-center justify-between py-3 px-4">

    <!-- LOGO -->
    <a href="hero.html" class="flex items-center gap-3">
      <img src="logo.png" class="h-9 w-auto" alt="Logo" />
      <span class="font-semibold text-lg tracking-wide text-gray-800">
        ЗАПУШИХА ТЕ?
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-6 text-gray-700 font-medium">
      <a href="hero.html" class="hover:text-blue-600 transition">Начало</a>
      <a href="submit.html" class="hover:text-blue-600 transition">Изпрати</a>
    </nav>

    <!-- Mobile Button -->
    <button id="menu-btn" class="md:hidden text-3xl text-gray-700">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu"
       class="hidden md:hidden flex flex-col bg-white border-t border-gray-200 shadow-inner px-4 py-3 space-y-2">
    <a href="hero.html" class="hover:text-blue-600 transition text-gray-700 font-medium">
      Начало
    </a>
    <a href="submit.html" class="hover:text-blue-600 transition text-gray-700 font-medium">
      Изпрати
    </a>
  </div>
</header>

<script>
  const btn = document.getElementById("menu-btn");
  const menu = document.getElementById("mobile-menu");
  btn.addEventListener("click", () => {
    menu.classList.toggle("hidden");
  });
</script>

<!-- HERO -->
<section class="bg-blue-600 text-white py-10 md:py-20 relative overflow-hidden">
<div class="absolute inset-0 bg-blue-700 opacity-20"></div>
<div class="max-w-4xl mx-auto text-center px-6 relative z-10">
<h1 class="text-3xl md:text-5xl font-extrabold leading-tight mb-4 md:mb-6">
Запушиха те?<br class="hidden md:block"/>Изпрати уведомление за секунди.
</h1>
<p class="text-base md:text-xl text-blue-100 mb-6 md:mb-8">
Бързо. Лесно. Безплатно.
</p>
<a href="submit.html"
class="bg-white text-blue-600 font-semibold px-6 py-3 md:px-8 md:py-4 rounded-xl shadow-lg hover:bg-gray-100 transition text-base md:text-lg">
Изпрати уведомление
</a>
</div>
</section>


<!-- STEPS -->
<section class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl -mt-10 md:-mt-12 p-6 md:p-10 relative z-20">
<h2 class="text-xl md:text-2xl font-bold text-center mb-8 md:mb-10 text-gray-800 tracking-wide">Как работи?</h2>


<div class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-10 text-center">


<!-- Step 1 -->
<div class="flex flex-col items-center">
<div class="flex items-center gap-2 bg-white border-4 border-gray-300 rounded-xl px-4 md:px-6 py-3 shadow-sm">
<div class="bg-blue-600 text-white font-bold px-2 py-1 rounded">BG</div>
<div class="text-gray-900 font-extrabold text-2xl md:text-3xl tracking-wider">1234 AB</div>
</div>
<p class="font-medium text-gray-700 mt-2 md:mt-3">Въведи регистрационен номер</p>
</div>


<!-- Step 2 -->
<div class="flex flex-col items-center">
<div class="text-blue-600 text-4xl md:text-5xl mb-3"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
<p class="font-medium text-gray-700">Качи снимка<br>(по желание)</p>
</div>


<!-- Step 3 -->
<div class="flex flex-col items-center">
<div class="text-blue-600 text-4xl md:text-5xl mb-3">📱</div>
<p class="font-medium text-gray-700">Изпрати съобщение</p>
</div>

</div>
</section>


</body>
</html>

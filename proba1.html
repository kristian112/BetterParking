<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Запушиха те?</title>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">
<div class="bg-white shadow-md rounded-xl p-8 w-full max-w-lg">

    <!-- Header -->
    <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">🚗</span>
        <h1 class="text-lg font-semibold">Запушиха те?</h1>
    </div>

    <h2 class="text-3xl font-bold text-blue-600 mb-2">Запушиха те?</h2>
    <p class="text-gray-600 mb-6">Въведи данните за уведомлението.</p>

    <form action="/send-sms" method="POST" enctype="multipart/form-data" class="space-y-4">

        <!-- Hidden fields for coordinates -->
        <input type="hidden" id="latitude" name="latitude" />
        <input type="hidden" id="longitude" name="longitude" />

        <!-- Status text for location -->
        <div id="location-status" class="text-sm text-gray-600"></div>

        <!-- Blocker License -->
        <div>
            <label class="font-semibold">Регистрационен номер</label>
            <input
                name="blocker_plate"
                class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                placeholder="CB 1234 AB"
                required
            />
        </div>

        <!-- Optional personal plate + file upload -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="font-semibold">Моят регистрационен номер (по желание)</label>
                <input
                    name="my_plate"
                    class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                    placeholder="CB 5678 AB"
                />
            </div>

            <div>
                <label class="font-semibold">Описание</label>
                <div class="mt-1 border rounded-lg p-3 flex flex-col justify-center items-center">
                    <input type="file" name="file" class="hidden" id="uploadFile" accept="image/*">
                    <button
                        type="button"
                        onclick="document.getElementById('uploadFile').click()"
                        class="text-blue-600 text-sm font-semibold"
                    >
                        ⬆️ Избери файл
                    </button>
                    <span class="text-xs text-gray-500 mt-1">PNG / JPG до 10MB</span>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div>
            <label class="font-semibold">Описание</label>
            <textarea
                name="description"
                class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 resize-y"
                placeholder="Пример: блокирал е изхода от паркинга..."
                rows="3"
            ></textarea>
        </div>

        <!-- Phone opt-in -->
        <div class="space-y-2 pt-2">
            <label class="flex items-center gap-2 cursor-pointer">
                <input
                    id="share-phone"
                    type="checkbox"
                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600"
                />
                <span class="text-sm text-gray-700">Желая да оставя телефон за контакт</span>
            </label>

            <div id="phone-wrapper" class="hidden">
                <label class="text-sm font-semibold text-gray-700">Телефонен номер</label>
                <input
                    id="phone-input"
                    type="tel"
                    name="phone"
                    placeholder="+359 88 123 4567"
                    class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                />
            </div>
        </div>

        <!-- Location -->
        <div>
            <label class="font-semibold">Местоположение</label>
            <input
                name="location"
                class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                placeholder=""
            />

            <!-- Get location button -->
            <button
                type="button"
                id="get-location"
                class="mt-3 px-4 py-2 text-xs rounded-full bg-green-600 text-white font-semibold hover:bg-green-700 transition"
            >
                Вземи текущото ми местоположение
            </button>

            <!-- Location display -->
            <div id="location-display" class="hidden mt-3">
                <label class="text-xs text-gray-600">Текуща локация</label>
                <textarea
                    id="location-text"
                    readonly
                    class="w-full mt-1 p-3 border rounded-lg bg-gray-100 text-sm"
                    rows="2"
                ></textarea>
            </div>
        </div>

        <!-- Submit button -->
        <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg text-lg hover:bg-blue-700 transition font-semibold"
        >
            Изпрати SMS
        </button>

    </form>
</div>

<!-- Scripts -->
<script>
    // Phone toggle
    document.getElementById("share-phone").addEventListener("change", () => {
        document.getElementById("phone-wrapper").classList.toggle("hidden");
    });

    // Form validation
    document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();

        const blockerPlate = document.querySelector('input[name="blocker_plate"]');
        const myPlate = document.querySelector('input[name="my_plate"]');
        const description = document.querySelector('textarea[name="description"]');
        const phoneCheckbox = document.getElementById("share-phone");
        const phoneInput = document.getElementById("phone-input");
        const fileInput = document.getElementById("uploadFile");

        const plateRegex = /^[A-ZА-Я]{1,2}\s?\d{3,4}\s?[A-ZА-Я]{1,2}$/;
        const phoneRegex = /^(?:\+359|0)\s?\d{2}\s?\d{3}\s?\d{3,4}$/;
        const descRegex = /^.{10,}$/;

        let errors = [];

        // Required: blocker plate
        if (!plateRegex.test(blockerPlate.value.trim())) {
            errors.push("Невалиден регистрационен номер на автомобила, който те е запушил.");
        }

        // Optional: my plate – validate only if filled
        if (myPlate.value.trim() !== "" && !plateRegex.test(myPlate.value.trim())) {
            errors.push("Невалиден регистрационен номер (твоят).");
        }

        // Description must be at least 10 characters
        if (!descRegex.test(description.value.trim())) {
            errors.push("Описанието трябва да е поне 10 символа.");
        }

        // Phone – only if checkbox is checked
        if (phoneCheckbox.checked) {
            if (phoneInput.value.trim() === "" || !phoneRegex.test(phoneInput.value.trim())) {
                errors.push("Въведи валиден телефонен номер.");
            }
        }

        // File validation (optional)
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            if (!["image/jpeg", "image/png"].includes(file.type)) {
                errors.push("Приеми само PNG или JPG файл.");
            }
            if (file.size > 10 * 1024 * 1024) {
                errors.push("Файлът трябва да бъде под 10MB.");
            }
        }

        if (errors.length > 0) {
            alert(errors.join("\n"));
            return;
        }

        // All good – submit to backend
        this.submit();
    });

    // Location System
    document.getElementById("get-location").addEventListener("click", () => {
        const displayBox = document.getElementById("location-display");
        const locationText = document.getElementById("location-text");
        const statusBox = document.getElementById("location-status");
        const hiddenLat = document.getElementById("latitude");
        const hiddenLon = document.getElementById("longitude");

        statusBox.textContent = "";
        statusBox.classList.remove("text-red-600", "text-blue-600", "text-green-600");

        if (!navigator.geolocation) {
            statusBox.textContent = "Вашият браузър не поддържа локация.";
            statusBox.classList.add("text-red-600");
            return;
        }

        statusBox.textContent = "Получаване на локация...";
        statusBox.classList.add("text-blue-600");

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lon = pos.coords.longitude.toFixed(6);

                hiddenLat.value = lat;
                hiddenLon.value = lon;

                locationText.value = `Текуща локация:\n${lat}, ${lon}`;
                displayBox.classList.remove("hidden");

                statusBox.textContent = `Локация получена: ${lat}, ${lon}`;
                statusBox.classList.remove("text-blue-600");
                statusBox.classList.add("text-green-600");
            },
            (err) => {
                let msg = "Грешка при получаване на локацията.";
                if (err.code === err.PERMISSION_DENIED) msg = "Достъпът до локация е отказан.";
                if (err.code === err.POSITION_UNAVAILABLE) msg = "Локацията не е налична.";
                if (err.code === err.TIMEOUT) msg = "Изтече времето за получаване.";

                statusBox.textContent = msg;
                statusBox.classList.remove("text-blue-600");
                statusBox.classList.add("text-red-600");
            }
        );
    });
</script>

</body>
</html>

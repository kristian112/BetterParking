<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детайли за сигнал</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="max-w-3xl mx-auto py-10">

    <!-- Back button -->
    <a href="kukataList.html"
       class="inline-flex items-center text-blue-600 font-medium mb-6 hover:underline">
      ← Обратно към списъка
    </a>

    <div class="bg-white p-8 shadow-xl rounded-2xl space-y-6">

      <h1 class="text-2xl font-bold text-gray-800">
        Детайли за сигнал
      </h1>

      <!-- Other car -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Регистрационен номер на другия автомобил</label>
        <p class="text-lg font-semibold text-gray-800">BG 1234 AB</p>
      </div>

      <!-- Your car -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Твоят регистрационен номер</label>
        <p class="text-lg font-semibold text-gray-800">BG 5678 CD</p>
      </div>

      <!-- Email -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Имейл</label>
        <p class="text-lg font-semibold text-gray-800">example@mail.com</p>
      </div>

      <!-- Phone -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Телефон</label>
        <p class="text-lg font-semibold text-gray-800">+359 88 123 4567</p>
      </div>

      <!-- Description -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Описание</label>
        <p class="text-gray-700 leading-relaxed">
          Имаше лека драскотина по бронята, автомобилът беше паркиран накриво.
        </p>
      </div>

      <!-- Image -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Снимка</label>
        <img src="/uploads/example.jpg"
             class="rounded-xl border shadow-md max-h-64 object-cover">
      </div>

      <!-- Location -->
      <div class="space-y-1">
        <label class="text-sm text-gray-600">Локация</label>
        <textarea readonly rows="2"
          class="w-full bg-gray-100 border rounded-xl px-3 py-2 text-sm shadow-sm">
Ул. „Иван Вазов“ 12, София (42.6977, 23.3219)
        </textarea>
      </div>

      <!-- Delete button -->
      <form action="/delete?id=123" method="post"
        onsubmit="return confirm('Сигурен ли си, че искаш да изтриеш този сигнал?');">
        <button type="submit"
          class="mt-4 px-5 py-2 bg-red-600 text-white font-semibold rounded-full shadow hover:bg-red-700 transition">
          Изтрий сигнала
        </button>
      </form>

      <!-- Timestamp -->
      <div class="pt-3 text-xs text-gray-500">
        Получено: 2025-01-12 14:23
      </div>

    </div>
  </div>

</body>
</html>

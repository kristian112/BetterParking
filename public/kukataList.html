<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Куката — Списък със сигнали</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <div class="max-w-4xl mx-auto py-10">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">
      📋 Списък със сигнали
    </h1>

    <!-- Контейнер, в който JS ще вкара елементите -->
    <div id="alerts-container"
         class="bg-white shadow-xl rounded-2xl divide-y border border-gray-200">
    </div>

  </div>

  <script>
    async function loadAlerts() {
      const container = document.getElementById("alerts-container");

      try {
        const res = await fetch("http://localhost:3000/admin/alerts");
        const json = await res.json();

        if (!json.success || json.data.length === 0) {
          container.innerHTML = `
            <p class="p-6 text-center text-gray-500">
              Няма подадени сигнали.
            </p>`;
          return;
        }

        // Генерираме HTML списък
        container.innerHTML = ""; 

        json.data.forEach(alert => {
          const time = new Date(alert.createdAt)
            .toLocaleString("bg-BG", { hour12: false });

          const itemHTML = `
            <a href="kukataDetails.html?id=${alert.id}"
               class="flex items-center justify-between p-5 hover:bg-gray-50 transition">

              <div class="flex flex-col">
                <span class="text-lg font-semibold text-gray-900 flex gap-2">
                  🚗 Друг автомобил: <span>${alert.otherCarID}</span>
                </span>

                <span class="text-sm text-gray-600">
                  Твоят номер: ${alert.yourCarID}
                </span>

                <span class="text-xs text-gray-400 mt-1">
                  Получено: ${time}
                </span>
              </div>

              <span class="text-blue-600 font-semibold text-sm">
                Виж детайли →
              </span>
            </a>
          `;

          container.innerHTML += itemHTML;
        });

      } catch (err) {
        container.innerHTML = `
          <p class="p-6 text-center text-red-500">
            Грешка при зареждане на данните.
          </p>`;
        console.error("Load error:", err);
      }
    }

    loadAlerts();
  </script>

</body>
</html>

<!doctype html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Докладвай ситуацията</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="bg-gray-100 font-sans">

 <header class="w-full bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto flex items-center justify-between py-3 px-4">

    <!-- LOGO -->
    <a href="hero.html" class="flex items-center gap-3">
      <img src="logo.png" class="h-9 w-auto" alt="Logo" />
      <span class="font-semibold text-lg tracking-wide text-gray-800">
        ЗАПУШИХА ТЕ?
      </span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-6 text-gray-700 font-medium">
      <a href="hero.html" class="hover:text-blue-600 transition">Начало</a>
      <a href="submit.html" class="hover:text-blue-600 transition">Изпрати</a>
    </nav>

    <!-- Mobile Button -->
    <button id="menu-btn" class="md:hidden text-3xl text-gray-700">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu"
       class="hidden md:hidden flex flex-col bg-white border-t border-gray-200 shadow-inner px-4 py-3 space-y-2">
    <a href="hero.html" class="hover:text-blue-600 transition text-gray-700 font-medium">
      Начало
    </a>
    <a href="submit.html" class="hover:text-blue-600 transition text-gray-700 font-medium">
      Изпрати
    </a>
  </div>
</header>

<script>
  const btn = document.getElementById("menu-btn");
  const menu = document.getElementById("mobile-menu");
  btn.addEventListener("click", () => {
    menu.classList.toggle("hidden");
  });
</script>

  <!-- HERO -->
 <section class="bg-blue-600 text-white py-8 relative overflow-hidden">
  <div class="absolute inset-0 bg-blue-700 opacity-20"></div>
  <div class="max-w-3xl mx-auto text-center px-6 relative z-10">
    <h1 class="text-3xl font-extrabold tracking-tight mb-2">
      Докладвай ситуацията
    </h1>
    <p class="text-blue-100 text-base">
      Въведи детайли, регистрационни номера, описание и качи снимка.
    </p>
  </div>
</section>

  <!-- FORM CARD -->
<main class="max-w-3xl mx-auto mt-10 px-4 pb-10">
    <form class="bg-white rounded-2xl shadow-xl p-8 space-y-6">

      <div class="space-y-1">
        <h2 class="text-2xl font-bold text-gray-800">
          Детайли за ситуацията
        </h2>
        <p class="text-sm text-gray-600">
          Въведи данните по-долу.
        </p>
      </div>

      <!-- Other license plate -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-gray-700">
          Регистрационен номер на другия автомобил
        </label>
        <input
          type="text"
          placeholder="BG 1234 AB"
          class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm shadow-sm focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <!-- Your plate -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-gray-700">
          Твоят регистрационен номер
        </label>
        <input
          type="text"
          placeholder="BG 5678 CD"
          class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm shadow-sm focus:ring-2 focus:ring-blue-600"
        />
      </div>

      <!-- Description -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-gray-700">
          Описание на ситуацията
        </label>
        <textarea
          rows="4"
          placeholder="Опиши какво се е случило..."
          class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm shadow-sm focus:ring-2 focus:ring-blue-600 resize-y"
        ></textarea>
      </div>

      <!-- Image upload -->
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-gray-700">
          Качи снимка (по желание)
        </label>

        <label
          class="mt-1 flex flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-8 text-center cursor-pointer hover:bg-gray-100 transition"
        >
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-blue-600"></i>
          <span class="text-sm font-medium text-gray-700">
            Натисни или пусни снимка тук
          </span>
          <span class="text-xs text-gray-500">
            PNG / JPG до 10MB
          </span>
          <input type="file" accept="image/*" class="hidden" />
        </label>
      </div>

      <!-- Phone opt-in -->
      <div class="space-y-3">
        <label class="flex items-start gap-3 cursor-pointer">
          <input
            id="share-phone"
            type="checkbox"
            class="mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-600"
          />
          <span class="text-sm text-gray-700">
            Желая да оставя телефон за контакт
          </span>
        </label>

        <div id="phone-wrapper" class="hidden space-y-1.5">
          <label class="text-sm font-semibold text-gray-700">
            Телефонен номер
          </label>
          <input
            type="tel"
            placeholder="+359 88 123 4567"
            class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm shadow-sm focus:ring-2 focus:ring-blue-600"
          />
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end gap-3 pt-2">
        <button
          type="reset"
          class="px-5 py-2 text-sm rounded-full border border-gray-300 text-gray-700 hover:bg-gray-100 transition"
        >
          Изчисти
        </button>
        <button
          type="submit"
          class="px-6 py-2 text-sm rounded-full bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
        >
          Изпрати
        </button>
      </div>

    </form>
  </main>

  <!-- JS for phone toggle -->
  <script>
    const sharePhone = document.getElementById("share-phone");
    const phoneWrapper = document.getElementById("phone-wrapper");

    sharePhone.addEventListener("change", () => {
      phoneWrapper.classList.toggle("hidden", !sharePhone.checked);
    });
  </script>

</body>
</html>
